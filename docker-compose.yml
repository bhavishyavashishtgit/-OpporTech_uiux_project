version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:server
    working_dir: /usr/src/app
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/opportech
      - CORS_ORIGIN=*
      - NODE_ENV=development
      - JWT_SECRET=change_this_secret
    depends_on:
      - mongo
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0
    working_dir: /usr/src/app
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:4000
    depends_on:
      - backend
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
